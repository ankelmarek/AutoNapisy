name: Windows UI artifact verification
on:
  push:
    branches: ['diagnostics/thumbnail017']
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify production code matches the compiled installer
        uses: actions/github-script@v7
        with:
          script: |
            const built='467cf148facce0ba4701a54360153ecf599fe4f7';
            const run=await github.rest.actions.getWorkflowRun({owner:context.repo.owner,repo:context.repo.repo,run_id:39096496441});
            if(run.data.head_sha!==built)throw Error('Installer source mismatch');
            const diff=await github.rest.repos.compareCommitsWithBasehead({owner:context.repo.owner,repo:context.repo.repo,basehead:built+'...'+context.sha});
            const allowed=new Set(['scripts/test-recovery-restart.mjs','scripts/test-webview.ps1','.github/workflows/windows.yml','.github/workflows/thumbnail-diagnostics.yml']);
            const unexpected=diff.data.files.filter(f=>!allowed.has(f.filename));
            if(unexpected.length)throw Error('Production code changed: '+unexpected.map(f=>f.filename).join(', '));
            console.log('Production code identical to Windows build '+built+'; only verification scripts differ.');
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: RolVixa-Windows-x64
          run-id: 39096496441
          github-token: ${{ github.token }}
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis
      - uses: actions/download-artifact@v4
        with:
          name: RolVixa-UI-Diagnostics
          run-id: 39096496441
          github-token: ${{ github.token }}
          path: src-tauri/target/x86_64-pc-windows-msvc/release
      - name: Verify installation resources and tools
        run: ./scripts/test-installer.ps1
      - name: Verify source I/O, crash recovery, future copies and editor interactions
        timeout-minutes: 8
        run: ./scripts/test-webview.ps1
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: RolVixa-Windows-x64
          path: ${{ env.ROLVIXA_INSTALLER }}
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RolVixa-UI-Verification
          path: |
            .tools/*.png
            .tools/*stdout.log
            .tools/*stderr.log
            docs/editor9-*.png
          if-no-files-found: ignore
