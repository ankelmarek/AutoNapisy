name: Thumbnail native diagnostics
on:
  push:
    branches: ['diagnostics/thumbnail017']
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: RolVixa-Windows-x64
          run-id: 39094937543
          github-token: ${{ github.token }}
          path: .tools/installer
      - uses: actions/download-artifact@v4
        with:
          name: RolVixa-UI-Diagnostics
          run-id: 39094937543
          github-token: ${{ github.token }}
          path: .tools/instrumented
      - name: Diagnose native thumbnail and source
        run: |
          $destination = Join-Path $env:RUNNER_TEMP 'RolVixa test Łódź'
          $setup = (Get-ChildItem .tools/installer/*.exe).FullName
          Start-Process -FilePath $setup -ArgumentList '/S', "/D=$destination" -Wait
          Copy-Item .tools/instrumented/rolvixa.exe (Join-Path $destination 'rolvixa.exe') -Force
          $env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS = '--remote-debugging-port=9222 --disable-gpu'
          $env:ROLVIXA_WEBVIEW_CDP = 'http://127.0.0.1:9222'
          $env:AUTONAPISY_FFMPEG = Join-Path $destination 'vendor/ffmpeg.exe'
          $env:ROLVIXA_TEST_PROJECT = Join-Path $env:RUNNER_TEMP 'RolVixa prawdziwy podgląd Łódź/projekt.json'
          $env:ROLVIXA_TEST_RECOVERY = Join-Path $env:RUNNER_TEMP 'RolVixa odzyskiwanie Łódź'
          node scripts/test-native-preview.mjs --prepare
          $app = Start-Process -FilePath (Join-Path $destination 'rolvixa.exe') -PassThru
          try {
            for ($n=0; $n -lt 120; $n++) { try { $null=Invoke-RestMethod "$env:ROLVIXA_WEBVIEW_CDP/json/version" -NoProxy -TimeoutSec 1; break } catch { Start-Sleep -Milliseconds 250 } }
            node scripts/test-native-preview.mjs
            if ($LASTEXITCODE) { throw 'Diagnostic failed' }
            node scripts/test-editor9.mjs
            if ($LASTEXITCODE) { throw 'Mocked UI diagnostic failed' }
          } finally { taskkill /PID $app.Id /T /F 2>$null | Out-Null }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Thumbnail-diagnostics
          path: .tools/native-preview.png
