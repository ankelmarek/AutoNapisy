name: Audio UI 0.16 diagnostics
on:
  push:
    branches: [diagnostics/audio-016]
permissions:
  contents: read
  actions: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: RolVixa-Windows-x64
          run-id: 39066339364
          github-token: ${{ github.token }}
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis
      - run: |
          $installer = Get-ChildItem 'src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*setup.exe' | Select-Object -First 1
          $destination = Join-Path $env:RUNNER_TEMP 'RolVixa test Łódź'
          $installed = Start-Process $installer.FullName -ArgumentList '/S', "/D=$destination" -Wait -PassThru
          if($installed.ExitCode -ne 0){throw 'Tool installation failed'}
      - name: Test frontend in Windows Edge while native build runs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .tools | Out-Null
          $env:AUTONAPISY_FFMPEG = Join-Path $env:RUNNER_TEMP 'RolVixa test Łódź/vendor/ffmpeg.exe'
          $env:ROLVIXA_WEBVIEW_CDP = 'http://127.0.0.1:9222'
          $vite = Start-Process cmd.exe -ArgumentList '/c npm.cmd run dev' -PassThru -RedirectStandardOutput '.tools/vite.log' -RedirectStandardError '.tools/vite-error.log'
          $edgePath = '${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe'
          $edgePath = Join-Path ${env:ProgramFiles(x86)} 'Microsoft/Edge/Application/msedge.exe'
          $edge = Start-Process $edgePath -ArgumentList @('--headless=new','--no-first-run','--remote-debugging-port=9222','--remote-allow-origins=*',"--user-data-dir=$env:RUNNER_TEMP/edge-ui",'about:blank') -PassThru
          try {
            for($i=0;$i -lt 100;$i++){try{$null=Invoke-RestMethod 'http://127.0.0.1:9222/json/version' -NoProxy -TimeoutSec 1;$null=Invoke-WebRequest 'http://127.0.0.1:1420' -NoProxy -TimeoutSec 1;break}catch{Start-Sleep -Milliseconds 250}}
            node scripts/test-editor9.mjs
            if($LASTEXITCODE -ne 0){throw 'Audio UI failed'}
          } finally {
            taskkill /PID $edge.Id /T /F 2>$null | Out-Null
            taskkill /PID $vite.Id /T /F 2>$null | Out-Null
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Audio-UI-captures
          path: |
            .tools/*.png
            .tools/*.log
            docs/editor15-*.png
          include-hidden-files: true
          if-no-files-found: ignore
