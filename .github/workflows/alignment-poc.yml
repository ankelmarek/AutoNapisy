name: Polish alignment research 0.35b
on:
  push:
    branches: [rolvixa-0.35b-caption-alignment]
    paths: ['scripts/poc-caption035b-alignment.py', '.github/workflows/alignment-poc.yml']
permissions:
  contents: read
jobs:
  poc:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install torch==2.7.1 torchaudio==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install soundfile==0.13.1
      - run: python scripts/poc-caption035b-alignment.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: polish-alignment-research
          path: .tools/alignment035b-poc/result.json
