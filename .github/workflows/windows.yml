name: Windows x64
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Cache bundled tools and license reports
        id: vendor-cache
        uses: actions/cache@v4
        with:
          path: src-tauri/.bundled
          restore-keys: vendor-x64-v1-
          key: vendor-x64-v1-${{ hashFiles('scripts/build-bundled-*', 'scripts/license-report.ps1', 'licenses/**', 'src-tauri/about.toml', 'package-lock.json', 'src-tauri/Cargo.lock') }}
      - name: Inspect restored FFmpeg resources
        id: ffmpeg-ready
        run: |
          $ready = $true
          foreach ($p in @('vendor/ffmpeg.exe', 'vendor/ffprobe.exe', 'sources/ffmpeg.tar.gz', 'sources/x264.tar.gz', 'sources/build-bundled-ffmpeg.sh', 'licenses/FFmpeg-GPL-2.0.txt', 'licenses/x264-COPYING.txt')) {
            if (-not (Test-Path "src-tauri/.bundled/$p")) { $ready = $false }
          }
          if ($ready) {
            $ready = (Get-FileHash scripts/build-bundled-ffmpeg.sh).Hash -eq (Get-FileHash src-tauri/.bundled/sources/build-bundled-ffmpeg.sh).Hash
          }
          "ready=$($ready.ToString().ToLower())" >> $env:GITHUB_OUTPUT
      - name: Restore FFmpeg intermediate objects
        id: ffmpeg-objects
        if: steps.ffmpeg-ready.outputs.ready != 'true'
        uses: actions/cache/restore@v4
        with:
          path: .tools/vendor-build
          key: ffmpeg-objects-v1-${{ hashFiles('scripts/build-bundled-ffmpeg.sh') }}
          restore-keys: ffmpeg-objects-v1-
      - uses: msys2/setup-msys2@v2
        if: steps.ffmpeg-ready.outputs.ready != 'true' 
        with:
          msystem: MINGW64
          update: true
          install: make diffutils curl mingw-w64-x86_64-gcc mingw-w64-x86_64-pkgconf mingw-w64-x86_64-nasm
      - name: Build FFmpeg and x264 from pinned sources
        if: steps.ffmpeg-ready.outputs.ready != 'true'
        shell: msys2 {0}
        run: ./scripts/build-bundled-ffmpeg.sh
      - name: Preserve FFmpeg intermediate objects
        if: always() && steps.ffmpeg-ready.outputs.ready != 'true' && steps.ffmpeg-objects.outputs.cache-hit != 'true' && hashFiles('.tools/vendor-build/ffmpeg/config.h') != ''
        uses: actions/cache/save@v4
        with:
          path: .tools/vendor-build
          key: ffmpeg-objects-v1-${{ hashFiles('scripts/build-bundled-ffmpeg.sh') }}
      - name: Build whisper.cpp and collect source licenses
        if: steps.vendor-cache.outputs.cache-hit != 'true'
        run: ./scripts/build-bundled-whisper.ps1
      - uses: taiki-e/install-action@cargo-about
        if: steps.vendor-cache.outputs.cache-hit != 'true'
      - name: Generate dependency license reports
        if: steps.vendor-cache.outputs.cache-hit != 'true'
        run: ./scripts/license-report.ps1
      - name: Test real montage export with bundled FFmpeg
        env:
          AUTONAPISY_FFMPEG: ${{ github.workspace }}/src-tauri/.bundled/vendor/ffmpeg.exe
        run: cargo test --locked --manifest-path .test-core/Cargo.toml --test montage_export -- --ignored --nocapture
      - run: npm run tauri -- build --target x86_64-pc-windows-msvc --config src-tauri/tauri.bundled.conf.json
      - name: Test actual installation and bundled tools
        run: ./scripts/test-installer.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: AutoNapisy-Windows-x64
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error
