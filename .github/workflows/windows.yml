name: Windows x64
on:
  push:
    # Roadmap-only pushes must not cancel a running installer build.
    paths-ignore:
      - 'README.md'
      - 'ROADMAP.md'
      - 'AGENTS.md'
      - 'docs/**'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Cancel older builds of the same branch
        if: github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.ref.replace('refs/heads/', '');
            const {data} = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner, repo: context.repo.repo,
              workflow_id: 'windows.yml', branch, status: 'in_progress'
            });
            for (const run of data.workflow_runs) {
              if (run.id < context.runId && run.event === 'push') {
                await github.rest.actions.cancelWorkflowRun({
                  owner: context.repo.owner, repo: context.repo.repo, run_id: run.id
                });
              }
            }
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Cache bundled tools and license reports
        id: vendor-cache
        uses: actions/cache@v4
        with:
          path: src-tauri/.bundled
          restore-keys: vendor-x64-v1-
          key: vendor-x64-v1-${{ hashFiles('scripts/build-bundled-*', 'scripts/prepare-audio.py', 'scripts/license-report.ps1', 'licenses/**', 'src-tauri/about.toml', 'package-lock.json', 'src-tauri/Cargo.lock') }}
      - name: Inspect restored FFmpeg resources
        id: ffmpeg-ready
        run: |
          $ready = $true
          foreach ($p in @('vendor/ffmpeg.exe', 'vendor/ffprobe.exe', 'sources/ffmpeg.tar.gz', 'sources/x264.tar.gz', 'sources/build-bundled-ffmpeg.sh', 'licenses/FFmpeg-GPL-2.0.txt', 'licenses/x264-COPYING.txt')) {
            if (-not (Test-Path "src-tauri/.bundled/$p")) { $ready = $false }
          }
          if ($ready) {
            $ready = (Get-FileHash scripts/build-bundled-ffmpeg.sh).Hash -eq (Get-FileHash src-tauri/.bundled/sources/build-bundled-ffmpeg.sh).Hash
          }
          "ready=$($ready.ToString().ToLower())" >> $env:GITHUB_OUTPUT
      - name: Inspect restored MLT runtime
        id: tools-ready
        run: |
          $ready = '${{ steps.ffmpeg-ready.outputs.ready }}' -eq 'true'
          foreach ($p in @('vendor/mlt/BUILD.txt', 'vendor/mlt/melt.exe', 'sources/build-bundled-mlt.sh', 'licenses/mlt/README.txt', 'vendor/whisper-cli.exe', 'sources/whisper.cpp.tar.gz', 'licenses/whisper.cpp-MIT.txt')) {
            if (-not (Test-Path "src-tauri/.bundled/$p")) { $ready = $false }
          }
          if ($ready) {
            $ready = (Get-FileHash scripts/build-bundled-mlt.sh).Hash -eq (Get-FileHash src-tauri/.bundled/sources/build-bundled-mlt.sh).Hash
          }
          "ready=$($ready.ToString().ToLower())" >> $env:GITHUB_OUTPUT
      - name: Restore FFmpeg intermediate objects
        id: ffmpeg-objects
        if: steps.ffmpeg-ready.outputs.ready != 'true'
        uses: actions/cache/restore@v4
        with:
          path: .tools/vendor-build
          key: ffmpeg-objects-v1-${{ hashFiles('scripts/build-bundled-ffmpeg.sh') }}
          restore-keys: ffmpeg-objects-v1-
      - uses: msys2/setup-msys2@v2
        if: steps.ffmpeg-ready.outputs.ready != 'true' 
        with:
          msystem: MINGW64
          update: true
          install: make diffutils curl mingw-w64-x86_64-gcc mingw-w64-x86_64-pkgconf mingw-w64-x86_64-nasm
      - name: Build FFmpeg and x264 from pinned sources
        if: steps.ffmpeg-ready.outputs.ready != 'true'
        shell: msys2 {0}
        run: ./scripts/build-bundled-ffmpeg.sh
      - name: Preserve FFmpeg intermediate objects
        if: always() && steps.ffmpeg-ready.outputs.ready != 'true' && steps.ffmpeg-objects.outputs.cache-hit != 'true' && hashFiles('.tools/vendor-build/ffmpeg/config.h') != ''
        uses: actions/cache/save@v4
        with:
          path: .tools/vendor-build
          key: ffmpeg-objects-v1-${{ hashFiles('scripts/build-bundled-ffmpeg.sh') }}
      - name: Restore MLT and FFmpeg build intermediates
        if: steps.tools-ready.outputs.ready != 'true'
        uses: actions/cache/restore@v4
        with:
          path: .tools/vendor-build
          key: ffmpeg-objects-v1-${{ hashFiles('scripts/build-bundled-ffmpeg.sh') }}
          restore-keys: ffmpeg-objects-v1-
      - name: Restore MLT compilation intermediates
        id: mlt-objects
        if: steps.tools-ready.outputs.ready != 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            .tools/mlt-build
            .tools/vendor-build/prefix
          key: mlt-objects-v1-${{ hashFiles('scripts/build-bundled-ffmpeg.sh') }}-${{ hashFiles('scripts/build-bundled-mlt.sh') }}
          restore-keys: mlt-objects-v1-${{ hashFiles('scripts/build-bundled-ffmpeg.sh') }}-
      - uses: msys2/setup-msys2@v2
        if: steps.tools-ready.outputs.ready != 'true'
        with:
          msystem: MINGW64
          update: true
          install: make diffutils curl mingw-w64-x86_64-gcc mingw-w64-x86_64-pkgconf mingw-w64-x86_64-nasm mingw-w64-x86_64-make mingw-w64-x86_64-cmake mingw-w64-x86_64-python
      - name: Build MLT engine and collect source licenses
        if: steps.tools-ready.outputs.ready != 'true'
        shell: msys2 {0}
        run: ./scripts/build-bundled-mlt.sh
      - name: Preserve MLT compilation intermediates
        if: always() && steps.tools-ready.outputs.ready != 'true' && steps.mlt-objects.outputs.cache-hit != 'true' && hashFiles('.tools/vendor-build/prefix/lib/libavformat.a') != ''
        uses: actions/cache/save@v4
        with:
          path: |
            .tools/mlt-build
            .tools/vendor-build/prefix
          key: mlt-objects-v1-${{ hashFiles('scripts/build-bundled-ffmpeg.sh') }}-${{ hashFiles('scripts/build-bundled-mlt.sh') }}
      - name: Build whisper.cpp and collect source licenses
        if: steps.tools-ready.outputs.ready != 'true'
        run: ./scripts/build-bundled-whisper.ps1
      - name: Prepare offline Kenney audio library
        run: |
          $ready = (Test-Path src-tauri/.bundled/vendor/audio/catalog.json) -and (Test-Path src-tauri/.bundled/sources/prepare-audio.py)
          if ($ready) { $ready = (Get-FileHash scripts/prepare-audio.py).Hash -eq (Get-FileHash src-tauri/.bundled/sources/prepare-audio.py).Hash }
          if (-not $ready) { python scripts/prepare-audio.py; if ($LASTEXITCODE) { throw 'Nie udało się przygotować dźwięków Kenney' } }
      - uses: taiki-e/install-action@cargo-about
        if: steps.vendor-cache.outputs.cache-hit != 'true'
      - name: Generate dependency license reports
        if: steps.vendor-cache.outputs.cache-hit != 'true'
        run: ./scripts/license-report.ps1
      - name: Preserve successfully built tools before editor tests
        if: steps.vendor-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: src-tauri/.bundled
          key: vendor-x64-v1-${{ hashFiles('scripts/build-bundled-*', 'scripts/prepare-audio.py', 'scripts/license-report.ps1', 'licenses/**', 'src-tauri/about.toml', 'package-lock.json', 'src-tauri/Cargo.lock') }}
      - name: Test real montage export with bundled FFmpeg
        env:
          AUTONAPISY_FFMPEG: ${{ github.workspace }}/src-tauri/.bundled/vendor/ffmpeg.exe
        run: cargo test --locked --manifest-path .test-core/Cargo.toml --test montage_export --test remote_audio -- --ignored --nocapture
      - name: Test real MLT timeline engine
        env:
          ROLVIXA_CAPTURE_PREVIEW: ${{ github.workspace }}/.tools/mock-stream.mp4
          ROLVIXA_MLT: ${{ github.workspace }}/src-tauri/.bundled/vendor/mlt/melt.exe
          AUTONAPISY_FFMPEG: ${{ github.workspace }}/src-tauri/.bundled/vendor/ffmpeg.exe
        run: cargo test --locked --manifest-path .test-core/Cargo.toml --test mlt_engine -- --ignored --nocapture
      - name: Test real framing with MLT and FFmpeg
        env:
          ROLVIXA_MLT: ${{ github.workspace }}/src-tauri/.bundled/vendor/mlt/melt.exe
          AUTONAPISY_FFMPEG: ${{ github.workspace }}/src-tauri/.bundled/vendor/ffmpeg.exe
        run: |
          cargo test --locked --manifest-path .test-core/Cargo.toml --test framing --test proxy_video --test audio_envelope --test source_range --test transition_gallery --test dynamic_tracks --test source_replace --test quality_audio --test ripple_mix --test smart_cut --test smart_cut_visual --test export_studio --test smart_export --test caption_stream --test speech_selection -- --ignored --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'Existing media regressions failed' }
          cargo test --locked --manifest-path .test-core/Cargo.toml --test caption_reanalysis bounded_pcm -- --ignored --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'Caption PCM fragment failed' }
      - name: Test short reanalysis on real Polish speech
        env:
          AUTONAPISY_FFMPEG: ${{ github.workspace }}/src-tauri/.bundled/vendor/ffmpeg.exe
          AUTONAPISY_WHISPER: ${{ github.workspace }}/src-tauri/.bundled/vendor/whisper-cli.exe
          AUTONAPISY_MODEL: ${{ github.workspace }}/.tools/caption035b-ggml-tiny.bin
          ROLVIXA_POLISH_SAMPLE: ${{ github.workspace }}/.tools/caption035b-polish.wav
          ROLVIXA_PL_RESULT: ${{ github.workspace }}/.tools/caption035b-recognized.json
        run: |
          ./scripts/prepare-caption035b-polish.ps1
          cargo test --locked --manifest-path .test-core/Cargo.toml --test caption_reanalysis real_polish -- --ignored --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'Real Polish reanalysis failed' }
      - run: npm run tauri -- build --target x86_64-pc-windows-msvc --config src-tauri/tauri.bundled.conf.json
      - name: Test actual installation and bundled tools
        id: installation
        run: ./scripts/test-installer.ps1
      - name: Build instrumented WebView2 test executable
        run: npm run tauri -- build --target x86_64-pc-windows-msvc --no-bundle --features tauri/devtools,ui-tests --config src-tauri/tauri.bundled.conf.json --config src-tauri/tauri.ui-tests.conf.json
      - name: Test real installed Tauri WebView2 editor
        # Eight real caption renders plus Full HD export and legacy regressions.
        timeout-minutes: 15
        run: ./scripts/test-webview.ps1
      - name: Preserve WebView2 screenshots
        if: always() && steps.installation.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: RolVixa-UI-Preview
          path: |
            .tools/caption033-*.png
            .tools/caption034-*.png
            .tools/caption035-*.png
            .tools/caption035b-*.png
            docs/editor029-*.png
            .tools/native-editor029.png
            docs/export032-*.png
            .tools/native-export032.png
            docs/studio031-*.png
            .tools/native-studio031.png
            docs/smartcut030-*.png
            .tools/native-smartcut030.png
            docs/smartcut028-*.png
            .tools/native-smartcut028.png
            docs/timeline027-*.png
            .tools/native-timeline027.png
            docs/audio026-*.png
            .tools/native-audio026.png
            docs/ripple025-*.png
            docs/sources023-*.png
            .tools/native-quality024-*.png
            .tools/native-sources023*.png
            docs/tracks022-*.png
            .tools/native-tracks022.png
            .tools/native-preview.png
            .tools/recovery-restart.png
            docs/start021-*.png
            docs/ux020-*.png
            docs/ux019-*.png
            docs/editor9-*.png
            .tools/native-ux019.png
            .tools/native-recent021.png
            .tools/editor-failure.png
          include-hidden-files: true
          if-no-files-found: ignore
      - name: Preserve UI test executable after a failed interaction test
        if: failure() && steps.installation.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: RolVixa-UI-Diagnostics
          path: src-tauri/target/x86_64-pc-windows-msvc/release/rolvixa.exe
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always() && steps.installation.outcome == 'success'
        with:
          name: RolVixa-Windows-x64
          path: ${{ env.ROLVIXA_INSTALLER }}
          if-no-files-found: error

      - name: Preserve actual Animated Captions 0.33a MP4 proof
        if: always() && steps.installation.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: RolVixa-Animated-Captions-POC
          path: |
            .tools/caption033-*.mp4
            .tools/caption034-*.mp4
            .tools/caption035-*.mp4
            .tools/caption035b-recognized.json
            .tools/caption035b-preview-recognized.json
            .tools/caption035-*.srt
          include-hidden-files: true
          if-no-files-found: ignore
