[package]
name = "autonapisy"
version = "0.3.0"
edition = "2021"
rust-version = "1.77.2"
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
sysinfo = "0.33"
tempfile = "3"
hound = "3.5"
