[package]
name = "rolvixa"
version = "0.25.0"
edition = "2021"
rust-version = "1.89"
[features]
# Native dialog fixture for the separately built CI executable only.
ui-tests = []
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
sysinfo = "0.33"
tempfile = "3"
hound = "3.5"
png = "0.17"
base64 = "0.22"

reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "query", "native-tls", "system-proxy"] }

